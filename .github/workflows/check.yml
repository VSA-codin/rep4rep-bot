name: Node.js checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies (install scripts disabled)
        run: npm ci --ignore-scripts
      - name: Build the sqlite3 native module (the only allowed install script)
        run: npm rebuild sqlite3
      - name: Validate source syntax
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Refuse to build with secrets tracked in git
        run: |
          if git ls-files | grep -E '(^|/)(config\.json|steamprofiles\.db.*|steam-2fa\.json|steam-passwords\.json|\.env)$'; then
            echo "Secret or runtime file is tracked by git" >&2
            exit 1
          fi
      - name: Dependency audit (informational)
        run: npm audit --omit=dev || true
